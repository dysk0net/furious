name: Build Stratum

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: Stratum-VST3-Windows
            cmake_extra: ""
          - name: macOS (Universal)
            os: macos-latest
            artifact: Stratum-VST3-macOS
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
          - name: Linux
            os: ubuntu-22.04
            artifact: Stratum-VST3-Linux
            cmake_extra: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${{ matrix.cmake_extra }}"

      - name: Build and run DSP self-test
        shell: bash
        run: |
          cmake --build build --config Release --target StratumDspTests
          ctest --test-dir build -C Release --output-on-failure

      - name: Build VST3
        shell: bash
        run: cmake --build build --config Release --target Stratum_VST3 --parallel

      - name: Collect VST3
        shell: bash
        run: |
          mkdir -p dist
          bundle="$(find build -type d -name 'Stratum.vst3' | head -n 1)"
          test -n "$bundle"
          cp -R "$bundle" dist/
          cp LICENSE README.md dist/ || true
          find dist -maxdepth 4 | head -n 40

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
